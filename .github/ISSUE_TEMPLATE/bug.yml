name: Bug report
description: Report a reproducible Bestdori conversion defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@haneoka/altair-plugin-bestdori 0.1.0"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal source
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected conversion
    validations:
      required: true
