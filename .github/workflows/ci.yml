name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altair-plugin-bestdori-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Bestdori plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair-plugin-bestdori
          persist-credentials: false

      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair
          path: altair-plugin-bestdori/.dependencies/altair
          persist-credentials: false

      - name: Check out Altair ADV plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-adv
          path: altair-plugin-bestdori/.dependencies/altair-plugin-adv
          persist-credentials: false

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: altair-plugin-bestdori/.dependencies/vega
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: altair-plugin-bestdori/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: altair-plugin-bestdori
        run: pnpm install --no-frozen-lockfile

      - name: Build dependency chain
        working-directory: altair-plugin-bestdori
        run: |
          pnpm --filter @haneoka/vega-protocol build
          pnpm --filter @haneoka/altair build:core
          pnpm --filter @haneoka/altair-plugin-adv build

      - name: Check package
        working-directory: altair-plugin-bestdori
        run: pnpm check

      - name: Inspect npm payload
        working-directory: altair-plugin-bestdori
        run: pnpm pack --dry-run
